\u2460 Voltage level : 380-480V low voltage (or 220-280V three-phase in some regions in Japan and Latin America), where the PV+ESS system and
loads are on the same low-voltage side
\u2461 Microgrid controller: Recommend SmartMGC5000B as controller. Only single grid connection point and single SmartLogger application
scenario is supported. When it is on-grid, the system can be scheduled by the third-party EMS. When the system is off-grid, the EMS cannot
issue any commands other than power scheduling to interfere with the system.
\u2462 Inverter : Huawei C&I inverter M3/MC0, V5/V5+, or V6; no more than two models can be used together.
\u2463 ESS : Huawei 241/215/161/107kWh; Not allow mix-use with the old air-cooled ESS, or containerized ESS or third-party ESS.
\u2464 Device quantity : Max 20 ESSs and 30 PV inverters in one system. PV-to-ESS ratio less than 2:1. 20ms seamless switching required rapid
switch, which model under test is 1000A and can support ESS 4 units@0.5C, 8 units@0.25C, 12 units@0.125C.
\u2465 Load rate: PCS total rated capacity > A x 10 + B/(2/3), where A indicates asynchronous loads and B indicates other common loads.
\u2466 Power distribution : TN and TT system @ three-phase four-wire , IT system connect to isolation transformer @ three -phase four-wire. The
number of poles (3P/4P) of the on/off-grid switch must be set according to the upper-level switch. If a 4P switch is used, it must be interlocked
with the neutral grounding switch in the microgrid.
\u2467 Auxiliary transformer : If the system voltage is greater than 415V AC, auxiliary transformers need to be configured to obtain power from the

Functions of the UPS:
\uF0D8 In the C&I on/off-grid scenario, the UPS is in standard configuration. The UPS provides uninterruptible power supply for the SmartMGC, battery cabinet BCU, and
on/off-grid switch/load switch.
\uF0D8 When the system shuts down due to low electricity, the power supply is faulty, or on/off-grid switchover is performed, the UPS supplies emergency power to the
monitoring system and on/off-grid switch to support remote black-start of the on/off-grid system.
\uF0D8 If no UPS is configured, the monitoring system may shut down unexpectedly and cannot provide functions properly when the power grid fluctuates. If the UPS power
backup time is insufficient and an outage lasts for a long period, the SmartMGC5000B and other monitoring devices may shut down after the system starts running
in off-grid mode. After the devices restart, manual confirmation is required to ensure that devices are restored to automatic running and control.
UPS specifications:
(1) Capacity > 1 kVA, online UPS
(2) Backup time: The backup time is greater than 48 hours in off-grid scenarios and
greater than 1 hour in other scenarios.
(3) Output voltage: 220 V AC
(4) Power of devices in the supported UPS range: The power of the SmartMGC is about
15 W. The power of each ESS cabinet: The instantaneous peak power is \u2265 500
W/cabinet, the shutdown power is about 15 W/cabinet, and the steady-state power is
about 30\u2013100 W/cabinet. And the power of the on/off-grid switch/load switch is
determined according to the specifications in the configuration device manual.
(5) UPS usage requirements: The UPS can run automatically and continuously with a
long backup time. In the off-grid scenario, the hybrid power supply or the power supply
devices of the same type can be used.

\u2022 Before the industrial revolution
\u2022 In 1903, F. W. Tyler put forward the scientific management theory.
\u2022 In 1924, W.A.Shewhart put forward the statistical quality control (SQC) theory.
\u2022 In 1950s, W. Edwards. Deming proposed the idea about quality improvement.
\u2022 In 1950s, dedicated methods for reliability improvement began to be developed in the industry circle.
\u2022 In 1958, the US military officials set the military quality management standards, such as MIL-Q-8958A.
\u2022 In early 1960s, Armand V. Feigenbaum put forward the concept of TQM.
\u2022 In 1962, Japan began to fully popularize the quality control circles (QCC) (Fishbone diagram invented by Ishikawa Kaoru ).
\u2022 In 1970s, Philip Crosby put forward the concept of zero defect (ZD) management.
\u2022 In 1987, the ISO 9000 series of quality management standards were published.
\u2022 In 1987, the Six Sigma management approach was put forward.
\u2022 In 1990s, the concept of big quality was formed. Quality management became the management
strategies for enterprises to win the core competitiveness. Standards of Deming Prize (Japan), Malcolm
Baldrige National Quality Award (USA), and European Quality Award were widely used.
\u2022 Doctor Juran called the 21st century as the century of quality!

7 Huawei Proprietary - Restricted Distribution`,sources:[{doc:"HCSP",page:105},{doc:"HCSA",page:45}]},{id:"HCSP-106",title:"Huawei Corporate Quality Objective, Guideline, and Strategy",text:`Huawei Corporate Quality Objective, Guideline, and Strategy
Make Huawei synonymous with high quality in the ICT industry.
Quality Guideline: Win with Quality
Always remember that quality is the foundation of Huawei's survival and the reason for customers to choose Huawei.
We accurately communicate customers' requirements and expectations to Huawei's entire value chain, jointly building a quality-oriented culture.
We respect rules and processes and do things right at the first time. We fulfill potential of employees around the globe for continuous improvement.
We work with customers to balance opportunities and risks, and quickly respond to their needs, achieving sustainable growth.
We undertake to provide customers quality-assured products, services, and solutions and consistently enable customers to experience our commitment in creating
value for each of them.
Strategy: Quality First
(1) Quality is Huawei's lifeblood. Quality is the cornerstone of our value proposition and brand image, as well as the foundation to build lasting and important
customer relationships and customer loyalty.
(2) Build superior products and fight against the practice of providing low-quality products at low prices. By focusing on end user experience, we must build quality
into our processes, results, and reputation in the business climate where we operate from four dimensions: systems, products, parts, and processes.
(3) Learn from the quality culture of Germany and Japan, combined with Huawei's realities, and build a Huawei quality culture that prioritizes process and rule
compliance, doing things right at the first time, and continuous improvement.
(4) Accurately convey customer requirements and expectations to global partners and effectively manage these requirements and expectations. Work with these
partners to build high quality and sustainability throughout the value chain.
(5) Respect expertise, advocate craftsmanship, and develop a group of world-class experts in each domain.
(6) Ensure that everyone working with Huawei pursues high quality. No one produces, transfers, or accepts nonconforming products. No one covers up issues, passes
the buck, or engages in fraudulent behavior. Every decision is made and every issue is resolved based on facts.
(7) Make managers the chief owners of quality; build a future-proof big quality management system based on processes.
8 Huawei Proprietary - Restricted Distribution`,sources:[{doc:"HCSP",page:106},{doc:"HCSA",page:46}]},{id:"HCSP-107",title:"Huawei Digital Power Corporate Quality Guideline",text:`Huawei Digital Power Corporate Quality Guideline
1. Raise a sense of responsibility.
\uF06C Each of us needs to truly understand our responsibilities, input, output, and working standards in the organization and process. We shall shoulder the responsibilities assigned
by the organization for processes, and complete our deliverables with high quality. Do not accept undutiful assignments from the upstream of the process or pass on defective
deliverables for the downstream of the process.
\uF06C When problems arise, we encourage everyone to first reflect on their unsatisfactory attitudes and behaviors. We oppose the behavior to blame others for their attitudes and
behaviors while one fails to fulfill one's own duties.
\uF06C We encourage mutual trust, for a faith in others facilitates one's own jobs.
\uF06C We encourage the exposure of problems and the positive attitude upon a newly found problem.
\uF06C Only when everyone in our organization shoulders their own responsibilities can we ensure a sound operation during every end-to-end phase, and the high quality of products
and services.
2. Do the right thing at the first time.
\uF06C Doing the right thing means that we are adopting a right strategy. The quality will be certainly unsatisfactory on the basis a wrong strategy. We first need to make sure we are
doing things in the right way.
\uF06C In our work, we must strive to do things right at the first time, and efficiently deliver products of high quality.
\uF06C We should understand and comply with processes, strictly follow processes, and ensure the certainty on results through the certainty on processes.
\uF06C We need to continuously improve capabilities, be open to learning, and consolidate the iron triangle featuring the mutual reinforcement of organizations, capabilities, and
processes, building a process- and capability-based organization.
3. Stick to the " ZD" principle and try to create values for customers and partners.
\uF06C The primary pursuit of Huawei Digital Power products is safety. The safety and friendliness requirements, which are free from personal injury, explosion, fire, escalation, and
breakdown, and are friendly to power grid, environment, and loads, crystallize our pursuit for high-quality Digital Power products.
\uF06C In our work, we should adhere to the "ZD" principle.
\uF06C Do not compromise on problems involving quality. Do not accept, manufacture, and tolerate the unqualified products.
\uF06C Quality management focuses on prevention. We glorify heroes who prevent quality problems rather than heroes who take remedial actions.
\uF06C Through high-quality products and services, Huawei Digital Power will improve its competitiveness in the market, create value for our customers and partners, and achieve our
own achievements based on the success of our customers and partners.
4. Win with quality and build industry-benchmark quality.
\uF06C In the long run, high quality is the ultimate reason why customers and partners choose Huawei and is the foundation for the long-term and sustainable development of
Huawei Digital Power.
\uF06C High quality stands for higher productivity, more premiums, and stronger competitiveness.
\uF06C Quality is the top priority and of the greatest importance. No matter when, we must prioritize quality, win with quality, and shall never yield in the pursuit for quality.
\uF06C In terms of end-to-end quality management, each organization of Huawei Digital Power shall ensure sufficient quality investment.
\uF06C Make Huawei synonymous with high quality in the ICT industry through our consistent delivery of high-quality products and services.

3 Huawei Confidential`,sources:[{doc:"HCSP",page:134},{doc:"HCSA",page:74}]},{id:"HCSP-135",title:"Safety Accident Cases 2/4 \u2014 ESS Accident in Project B Killed Three (Including Firefighters)",text:`Safety Accident Cases 2/4 \u2014 ESS Accident in Project B Killed Three (Including Firefighters)
and Injured One, and Related Personnel Were Arrested
\uF06C Project background : In April 2019, project B in a country was officially put into operation, involving 1.4 MW rooftop PV system, 4 MW/12
MWh ESSs, and chargers.
\uF06C Accident description: A fire alarm was reported from the southern area at 12:27 on April 16, 2021. When firefighters arrived at the site, the
ESS in the northern area exploded at 14:15 without warning, causing casualties.
\uF06C Investigation conclusion: The direct cause of the explosion in the north building was that a lithium iron phosphate battery in the south
building was short-circuited . (Before the accident, the BMS reported multiple alarms that indicated overheating and overdischarge, but the
operation personnel did not attach attention to them.) As a result, the battery and battery pack caught on fire due to thermal runaway. The
flammable and explosive components spread to the ESS room in the north building (no smoke and combustible gas detection equipment)
through the outdoor underground cable trench (not enclosed) and mixed with air to form explosive gas, causing the explosion triggered by
electric sparks.
Consequence:
Three people, including firefighters, were killed and one was injured.
Penalty:
\uF070 The relevant management personnel of the company involved were
approved for arrest as they were directly responsible for the accident
and were suspected of committing a crime for negligently causing a
serious accident.
\uF070 The company involved was also subject to administrative penalties by
the fire department in accordance with relevant regulations.
\uF070 Eight relevant management personnel of the administrative organs in
the region were subject to disciplinary actions such as administrative
warnings and demerit recording .
4 Huawei Confidential`,sources:[{doc:"HCSP",page:135},{doc:"HCSA",page:75}]},{id:"HCSP-136",title:"Safety Accident Cases 3/4 \u2014 An Energy Storage Plant Accident Burned Batteries in Two",text:`Safety Accident Cases 3/4 \u2014 An Energy Storage Plant Accident Burned Batteries in Two
Containers and Caused a Loss of Millions of Dollars
\uF06C Project background: Company C and a renewable energy developer jointly
developed the largest battery energy storage project in a country. The project
mainly provides auxiliary power services to meet the peak capacity
requirements of power transmission. The project was expected to be put into
operation in December 2021.
\uF06C Accident description: At about 10:00 on July 30, 2021 (local time), during
the commissioning of the project, lithium batteries in a container caught fire
and ignited another container nearby. The fire lasted for four days before it
was put out.
\uF06C Investigation conclusion : The leakage in the cooling system caused a
battery short circuit . As a result, electronic components were on fire,
causing thermal runaway. The fire occurred in the adjacent battery
compartment of a container and then spread to the next container, eventually
to the entire ESS. It is also worth noting that the monitoring system did not
provide 24/7 online services as required.
Consequences:
\uF070 Before the project kick-off, an emergency plan had been made and emergency
drills had been conducted. Therefore, after the fire broke out, all personnel
quickly evacuated, and no casualties were caused onsite.
\uF070 After the fire broke out, the vendor's experts kept communicating with the fire
department and provided many effective suggestions. They did not open the
container or put out the fire, but only sprayed water around for cooling to
prevent the fire from spreading. This effectively prevented the situation from
getting worse.

15 Huawei Confidential`,sources:[{doc:"HCSP",page:146},{doc:"HCSA",page:86}]},{id:"HCSP-147",title:"Example of Using the SAROP Method",text:`Example of Using the SAROP Method
If I plan to install the residential ESS, what should I consider before the installation?
(1) Do I have the skills and knowledge required to do this job?
Do I know the features, installation precautions, and basic working principles of the residential ESS?
(2) Do I hold the permit required for this work or have I obtained the approval?
Are there any special certification requirements (such as electrician certificate) for local electricity construction?
Is the installation permitted by the owner and property management company?
(3) Have I identified the risks of this work and taken measures to ensure my safety?
Is there any risk of electric shocks when the PV system is connected? Is it possible that rain may cause electric shocks?
Is there any possibility of injury during device transportation?
(4) Have I checked that my activities do not endanger or affect the safety of other personnel?
May any child stay close to the installation site? Are there any safety risks if other personnel get close to the site?
Will the transportation cause damage to the owner's home?
(5) Have I used the right PPE?
Are protective shoes with insulation and impact-proof functions worn? Are insulated gloves worn? Are necessary
insulated tools available?

\uF075 Goods must be placed on pallets instead of on the ground.
\uF075 If stacking is required, stack a maximum of two pallets. The total height should

\uF075 Do not stack containers or outdoor cabinets.
\uF075 Handle the goods with care to avoid percussion, puncture, and toppling. Protect
the goods from high temperatures, fire, and water.
\uF075 Do not remove the original package.
Secondary Packaging
\uF075 Pack lithium batteries and dangerous goods separately on pallets.
\uF075 If packaging film is used, attach labels to the packaging film to indicate
dangerous goods, so as to ensure that the labels are visible during unloading.

Operations with Power On
\uF06C Accident: On April 11, 2021, operator A personally undertook the line maintenance and gas pipe reconstruction task
from a technology company. When operator A was working on the ceiling of a
dust-free workshop, he asked operator B to turn on the circuit breaker. However, when operator A was connecting
cables, he didn't ask operator B to turn off the circuit breaker. Operator A touched a bare 220 V power cable and had an
electric shock. Operator B went to the ceiling to rescue operator A, but they fell during the rescue. As a result, operator A
died of electric shock, and operator B was seriously injured due to falling.
\uF06C Cause: Operator A failed to obtain the certificates for special operation (electrical operator certificate) , didn't
wear PPE during operation , didn't power off the equipment or test the power , and didn't hang "no circuit breaker
on" sign when overhauling machine lines on the ceiling.
\uF06C Disciplinary Actions:
\uF0D8 Operator A bore direct responsibility for the accident. As he died, he was exempted from being held accountable.
\uF0D8 The technology company involved was fined CNY270,000, and person in charge of the technology company was
fined CNY7,170.

56 Huawei Confidential`,sources:[{doc:"HCSP",page:187},{doc:"HCSA",page:127}]},{id:"HCSP-188",title:"Precautions for Handling Fire \u2014 Special PPE Required for ESS Fire",text:`Precautions for Handling Fire \u2014 Special PPE Required for ESS Fire
\uF06C After an audible and visual alarm is generated or when smoke or fire occurs in the ESS, stay away from the ESS and do not open
the door before confirming safety. Otherwise, a large amount of oxygen that enters the ESS will cause explosion and personal
safety risks.
\uF06C If only smoke comes out of the ESS, observe the situation remotely. Do not approach the ESS to spray water in case of battery
short circuits and sparks, which may cause explosion with the combustible gases in the ESS.
\uF06C If a lithium battery catches fire, flammable and toxic gases will be released. Therefore, during the extinguishing process, all
firefighters must wear a full set of protective suite, including flame retardant/fireproof clothing, air-purifying respirator or
breathing apparatus, firefighter helmet and mask, and insulated shoes .
\uF06C A lithium battery fire may last for several hours. After it is extinguished, the fire may be reignited by the heat generated from
residual ingredients due to internal cell damage. After an open flame is extinguished, continue spraying water to cool the
batteries . Wait until the battery temperature drops to the room temperature \xB1 10\xB0C and monitor for 24 hours to ensure that there
is no sign of temperature rise before removing the batteries. Move the removed batteries to a safe place (an open and safe
outdoor place is recommended), and then place the batteries in the fire sandbox or salt water.
* The fire handling process is for reference only. The specific process shall be formulated based on the
requirements of the local fire department and onsite conditions.
57 Huawei Confidential`,sources:[{doc:"HCSP",page:188},{doc:"HCSA",page:128}]},{id:"HCSP-189",title:"Precautions for Battery Recycling \u2014 Recycle or Dispose of Waste Batteries in Compliance",text:`Precautions for Battery Recycling \u2014 Recycle or Dispose of Waste Batteries in Compliance
with Local Laws and Regulations
\uF06C Dispose of waste batteries in accordance with local laws and regulations. Do not dispose of batteries as
household waste. Improper disposal of batteries may result in environmental pollution or an explosion.
\uF06C If a battery leaks or is damaged , contact technical support or a battery recycling company for disposal .
\uF06C If batteries are out of service life , contact a battery recycling company for disposal .
\uF06C Monitor damaged batteries during storage for signs of smoke, flame, electrolyte leakage, or heat.
\uF06C Do not expose waste batteries to high temperatures or direct sunlight .
\uF06C Do not place waste batteries in environments with high humidity or corrosive substances .
\uF06C Do not use faulty batteries. Contact a battery recycling company to scrap them as soon as possible to
avoid environmental pollution.
* The battery recycling process is for reference only and must comply with local laws and regulations.

11 Huawei Confidential`,sources:[{doc:"HCSA",page:12}]},{id:"HCSA-13",title:"What Is a C&I PV Plant?",text:`What Is a C&I PV Plant?
C&I PV Plant
Generally, hundreds of kW to dozens of MW plants are constructed on the rooftops of C&I
buildings such as large factories. The scale is small, usually less than 20 MW. The sites are scattered

","5 inverter models allowed"],explanationCz:"Hlavn\xED projek\u010Dn\xED pravidla pro Off-grid a On/Off-grid: 1) Nap\u011Bt\xED s\xEDt\u011B 380\u2013480 V, 2) Max. 2 r\u016Fzn\xE9 modely FV st\u0159\xEDda\u010D\u016F v syst\xE9mu, 3) Pom\u011Br v\xFDkonu PV : v\xFDkonu ESS mus\xED b\xFDt < 2 : 1, 4) V\xFDkon PCS > A\xD710 + B/(2/3) (A = p\u0159\xEDm\xFD rozb\u011Bh motor\u016F, B = soft-start/VFD), 5) P\u0159i nap\u011Bt\xED >415 V je nutn\xFD pomocn\xFD transform\xE1tor 5 kVA \xD7 N, 6) Extern\xED UPS >1 kVA / 220 V se z\xE1lohou \u22651 h (on/off-grid) nebo >48 h (\u010Dist\xFD off-grid) a \u0161pi\u010Dkou \u2265500 W/ESS, 7) D\xE9lka silov\xE9ho kabelu od PCS k rozvad\u011B\u010Di \u22655 m, 8) Uzemn\u011Bn\xED v\xFDhradn\u011B TN-S nebo TN-C-S."},{id:"hcsp-site-safety-distances-firewall",category:"HCSP Design",title:"ESS Site Selection Safety Distances & Firewall Rules",shortAnswer:"Pouze venku \xB7 Ho\u0159laviny \u226510 m vp\u0159edu / \u22657.6 m boky a z\xE1da \xB7 Ze\u010F 2 h (\u2265120 mm) zkr\xE1t\xED 3 m na 0.9 m \xB7 Kl\xED\u010Dov\xE1 m\xEDsta v\u017Edy \u22653 m",source:"HCSP V1.0 \u2013 Design of C&I Smart PV Solution, str. 90\u201394",keywords:["site selection","flammable","10m","7.6m","firewall","0.9m","2-hour","120mm","densely populated","vegetation","3m","1.4m","indoor","outdoor only","odstupov\xE9 vzd\xE1lenosti","protipo\u017E\xE1rn\xED ze\u010F","um\xEDst\u011Bn\xED ess"],truthPatterns:["outdoor only","10m","7.6m","3m","0.9m","2-hour","2h","120mm","extend 1m","1.4m","cannot be shortened with a firewall","no vegetation within 3m"],falseTraps:["can be installed indoors or in basement","can be installed on populated building rooftop without review","firewall shortens densely populated key position distance to 0.9m"],explanationCz:"Bezpe\u010Dnostn\xED pravidla um\xEDst\u011Bn\xED C&I ESS: 1) V\xFDhradn\u011B venkovn\xED instalace na zemi (z\xE1kaz vnit\u0159n\xEDch prostor, sklep\u016F i st\u0159ech ob\xFDvan\xFDch budov), 2) Od ho\u0159lavi xEDc\u016F."},{id:"hcsp-cabinet-spacing-layout",category:"HCSP Design",title:"Multi-Cabinet ESS Spacing & Grouping Layout Rules",shortAnswer:"\u010Celo \u22652.5 m \xB7 Bok \u22650.1 m \xB7 Z\xE1da \u22650.3 m \xB7 Max 12 v \u0159ad\u011B (nad 12 d\u011Blit po 6 s mezerou \u22651 m) \xB7 Max 50 na lokalitu",source:"HCSP V1.0 \u2013 Design of C&I Smart PV Solution, str. 96\u201397",keywords:["cabinet spacing","clearance","2.5m","0.1m","100mm","0.3m","300mm","face-to-face","back-to-back","12 units","6 units","50 units per site","rozestupy kabinet\u016F","vzd\xE1lenosti mezi kabinety"],truthPatterns:["2.5m","0.1m","0.3m","12 cabinets","\u226412","groups of 6","1m between groups","\u226450","50 cabinets per site"],falseTraps:["side clearance must be 2m","single row of 30 without gap"],explanationCz:"Minim\xE1ln\xED rozestupy kabinet\u016F LUNA2000: p\u0159edn\xED strana (dve\u0159e) \u22652,5 m, bo\u010Dn\xED rozestup \u22650,1 m (100 mm), z\xE1dy k sob\u011B \u22650,3 m (300 mm), \u010Delem k sob\u011B \u22652,5 m. V jedn\xE9 \u0159ad\u011B sm\xED b\xFDt max. 12 kabinet\u016F; p\u0159i uspo\u0159\xE1d\xE1n\xED \u226512 kabinet\u016F \u010Delem k sob\u011B se d\u011Bl\xED do skupin max. po 6 ks s mezerou \u22651 m mezi skupinami. Celkem max. 50 kabinet\u016F v jedn\xE9 lokalit\u011B."},{id:"pqm-quality-definitions-history",category:"Partner Quality",title:"Quality Definitions & History (Crosby, ISO 9000, Shewhart, Deming, Feigenbaum, Ishikawa, Juran)",shortAnswer:"Crosby: shoda s po\u017Eadavky + Zero Defects \xB7 Shewhart 1924 SQC \xB7 Feigenbaum TQM \xB7 Ishikawa QCC \xB7 ISO 9000 / Six Sigma 1987",source:"HCSP str. 101\u2013107 / HCSA str. 41\u201347 (Partner Quality Management)",keywords:["conformance to requirements","crosby","zero defects","shewhart","deming","feigenbaum","tqm","ishikawa","qcc","juran","iso 9000","six sigma","1924","1987","definice kvality","historie kvality"],truthPatterns:["conformance to requirements","inherent characteristics fulfills requirements","shewhart","1924","sqc","feigenbaum","tqm","ishikawa","1962","qcc","crosby","zero defects","1987","six sigma","juran","21st century is the century of quality","win with quality","quality first"],explanationCz:"Miln\xEDky \u0159\xEDzen\xED kvality: Crosby definoval kvalitu jako \u201Eshodu s po\u017Eadavky\u201C (conformance to requirements) a zavedl princip Zero Defects (nulov\xE9 vady, 70. l\xE9ta). ISO 9000 ji definuje jako m\xEDru, v n\xED\u017E soubor vlastn\xEDch charakteristik spl\u0148uje po\u017Eadavky. Shewhart (1924) zavedl regula\u010Dn\xED diagramy SQC, Deming (50. l\xE9ta) statistick\xE9 metody v Japonsku, Feigenbaum (60. l\xE9ta) TQM, Ishikawa (1962) krou\u017Eky kvality QCC, v r. 1987 vznikly ISO 9000 a Six Sigma (Motorola) a Juran ozna\u010Dil 21. stolet\xED za stolet\xED kvality. Strategie Huawei: \u201EWin with Quality\u201C a \u201EQuality First\u201C."},{id:"pqm-sqa-lbpgp-model",category:"Partner Quality",title:'SQA Role Model LBPGP & "Five Understandings and Four Capabilities"',shortAnswer:"LBPGP: Listener, Builder, Practitioner, Guardian, Pusher",source:"HCSP str. 108\u2013112 / HCSA str. 48\u201352 (Partner Quality Management)",keywords:["lbpgp","sqa","listener","builder","practitioner","guardian","pusher","five understandings","four capabilities","role sqa"],truthPatterns:["listener","builder","practitioner","guardian","pusher","five understandings","four capabilities","quality planning","quality measurement","quality review","quality backtracking"],explanationCz:"Model role SQA in\u017Een\xFDra nese zkratku LBPGP: Listener (naslouch\xE1 po\u017Eadavk\u016Fm z\xE1kazn\xEDka), Builder (buduje syst\xE9m kvality), Practitioner (aplikuje kulturu a procesy kvality), Guardian (str\xE1\u017Ece \u010Derven\xFDch lini\xED kvality a bezpe\u010Dnosti) a Pusher (prosazuje neust\xE1l\xE9 zlep\u0161ov\xE1n\xED). \u010Cty\u0159i kl\xED\u010Dov\xE9 \xFAkoly SQA jsou: Quality Planning, Quality Measurement, Quality Review a Quality Backtracking."},{id:"pqm-measurement-bsc-ftpr-backtracking",category:"Partner Quality",title:"Quality Measurement (BSC, First-Time Pass Rate) & Quality Backtracking (5 Whys)",shortAnswer:"FTPR = schv\xE1len\xE9 napoprv\xE9 / celkem kontrolovan\xFDch \xD7 100 % \xB7 5 Whys pro ko\u0159enovou p\u0159\xED\u010Dinu",source:"HCSP str. 113\u2013128 / HCSA str. 53\u201368 (Partner Quality Management)",keywords:["balanced scorecard","bsc","first-time pass rate","pass rate","forward unfolding","reverse unfolding","5 whys","five whys","backtracking","root cause","pr\u016Fchodnost napoprv\xE9","ko\u0159enov\xE1 p\u0159\xED\u010Dina"],truthPatterns:["first-time pass rate","passed at the first time","total inspected","forward unfolding","reverse unfolding","5 whys","five whys","on-site inspection","remote photo","document review","interview"],explanationCz:"M\u011B\u0159en\xED kvality vyu\u017E\xEDv\xE1 3vrstv\xFD Balanced Scorecard (BSC) a ukazatel First-Time Pass Rate (po\u010Det polo\u017Eek schv\xE1len\xFDch hned p\u0159i prvn\xED kontrole / celkov\xFD po\u010Det kontrolovan\xFDch polo\u017Eek \xD7 100 %). Kontrola kvality (Quality Review) se rozpad\xE1 dop\u0159edn\u011B (dle proces\u016F) a zp\u011Btn\u011B (dle historick\xFDch vad). Pro zp\u011Btn\xE9 dohled\xE1n\xED ko\u0159enov\xE9 p\u0159\xED\u010Diny (Quality Backtracking) slou\u017E\xED metoda 5 Whys (5\xD7 Pro\u010D)."},{id:"pqm-ess-torque-insulation-checklist",category:"Partner Quality",title:"C&I ESS Installation Quality Checklist: Torque Values, Cable Rules & Insulation Resistance",shortAnswer:"Pack 13 N\xB7m \xB7 P\u0159\xEDpojnice 27 N\xB7m \xB7 PCS 40 N\xB7m \xB7 DCDC 21 N\xB7m \xB7 Ohyb >15D \xB7 Odstup \u226530 mm \xB7 AC >10 M\u03A9 / DC >2 M\u03A9 \xB7 PSU \u226424 h",source:"HCSP str. 119\u2013124 / HCSA str. 59\u201364 (Partner Quality Management)",keywords:["torque","13 n\xB7m","13 nm","27 n\xB7m","27 nm","40 n\xB7m","40 nm","21 n\xB7m","21 nm","1.2 n\xB7m","5 n\xB7m","bending radius","15d","30mm","10 m\u03C9","10 mohm","2 m\u03C9","2 mohm","psu","24 hours","utahovac\xED moment","izola\u010Dn\xED odpor","polom\u011Br ohybu"],truthPatterns:["13 n","27 n","40 n","21 n","1.2 n","5 n",">15d","15d","30mm","\u226530mm","24 hours","24h",">10 m","10 m\u03C9",">2 m","2 m\u03C9"],falseTraps:["install psu 1 month before power-on","ac insulation >0.5 mohm","bending radius 5d"],explanationCz:"Kontroln\xED parametry kvality instalace C&I ESS: Utahovac\xED momenty \u2013 upevn\u011Bn\xED bateriov\xE9ho packu 13 N\xB7m, m\u011Bd\u011Bn\xE9 DC propojky (copper bars) 27 N\xB7m, DC sp\xEDna\u010D ESS 27 N\xB7m, Smart PCS AC/DC svorky 40 N\xB7m, DCDC DC kabel 21 N\xB7m, rack controller M4 1,2 N\xB7m a M6 5 N\xB7m. Polom\u011Br ohybu silov\xE9ho kabelu >15D, odstup silov\xFDch a sign\xE1lov\xFDch kabel\u016F \u226530 mm. Modul PSU instalovat max. 24 h p\u0159ed zapnut\xEDm. Izola\u010Dn\xED odpor p\u0159ed zapnut\xEDm: AC v\u016F\u010Di zemi >10 M\u03A9, DC+/DC- v\u016F\u010Di zemi >2 M\u03A9."},{id:"safety-phases-rules-sarop",category:"Safety Management",title:"4 Safety Culture Phases, 3 Safety Rules Priority & SAROP Tool",shortAnswer:"4 f\xE1ze: Instinct \u2192 Dependent \u2192 Independent \u2192 Mutual \xB7 Priorita: Willingness > Awareness > Knowledge > Facilities \xB7 SAROP",source:"HCSP str. 140\u2013147 / HCSA str. 80\u201387 (Safety Management)",keywords:["sarop","four phases","natural instinct","dependent","independent","interdependent","mutual","safety willingness","safety awareness","du pont","bradley curve","\u010Dty\u0159i f\xE1ze bezpe\u010Dnosti","ochota k bezpe\u010Dnosti"],truthPatterns:["skill","approve","risk","others","ppe","sarop","natural instinct","supervision","dependent","self-management","independent","team management","mutual","interdependent","willingness > safety awareness > safety knowledge > safety facilities"],falseTraps:["facilities are more important than safety willingness"],explanationCz:"\u0158\xEDzen\xED bezpe\u010Dnosti: 1) \u010Cty\u0159i v\xFDvojov\xE9 f\xE1ze: Natural Instinct (p\u0159irozen\xFD instinkt) \u2192 Dependent / Supervision (dohled) \u2192 Independent / Self-management (vlastn\xED \u0159\xEDzen\xED) \u2192 Mutual / Team management (t\xFDmov\xE1 vz\xE1jemnost, nejvy\u0161\u0161\xED \xFArove\u0148). 2) Priorita prvk\u016F: Safety Willingness (ochota) > Safety Awareness (pov\u011Bdom\xED) > Safety Knowledge (znalosti) > Safety Facilities (vybaven\xED). 3) N\xE1stroj p\u0159ed zah\xE1jen\xEDm pr\xE1ce SAROP = Skill (dovednosti), Approve (opr\xE1vn\u011Bn\xED/povolen\xED), Risk (identifikace rizik), Others (neohro\u017Een\xED ostatn\xEDch), PPE (OOPP)."},{id:"safety-signs-colors",category:"Safety Management",title:"Four Safety Sign Categories & Colors (Red, Yellow, Blue, Green)",shortAnswer:"\u010Cerven\xE1 = Z\xE1kaz (Prohibition) \xB7 \u017Dlut\xE1 = V\xFDstraha (Warning) \xB7 Modr\xE1 = P\u0159\xEDkaz (Mandatory) \xB7 Zelen\xE1 = Bezpe\u010D\xED/Info",source:"HCSP str. 154\u2013156 / HCSA str. 94\u201396 (Safety Management)",keywords:["safety signs","prohibition sign","warning sign","mandatory sign","safe condition","red sign","yellow sign","blue sign","green sign","bezpe\u010Dnostn\xED zna\u010Dky","barvy zna\u010Dek"],truthPatterns:["red","prohibition","do not","yellow","warning","danger","caution","blue","mandatory","must wear","green","safe condition","emergency exit","first aid"],falseTraps:["blue means warning","yellow means mandatory action","red means mandatory"],explanationCz:"V\xFDznam 4 barev bezpe\u010Dnostn\xEDho zna\u010Den\xED: \u010Cerven\xE1 = z\xE1kazov\xE9 a protipo\u017E\xE1rn\xED zna\u010Dky (Prohibition \u2013 \u201ENed\u011Blejte\u201C), \u017Dlut\xE1 = v\xFDstra\u017En\xE9 zna\u010Dky (Warning \u2013 \u201EPozor, nebezpe\u010D\xED\u201C), Modr\xE1 = p\u0159\xEDkazov\xE9 zna\u010Dky (Mandatory \u2013 \u201EMus\xEDte pou\u017E\xEDt OOPP/postup\u201C), Zelen\xE1 = informa\u010Dn\xED a \xFAnikov\xE9 zna\u010Dky (Safe condition \u2013 \xFAnikov\xFD v\xFDchod, prvn\xED pomoc)."},{id:"safety-battery
